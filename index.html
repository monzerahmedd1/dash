function corr(a,b){const n=a.length;if(n<3)return NaN;const p=mean(a),q=mean(b);let s=0,x=0,y=0;for(let i=0;i<n;i++){s+=(a[i]-p)*(b[i]-q);x+=(a[i]-p)**2;y+=(b[i]-q)**2}return x&&y?s/Math.sqrt(x*y):NaN}
